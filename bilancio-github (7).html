<!DOCTYPE html>
<html lang="it">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no" />
<title>Bilancio</title>
<link rel="preconnect" href="https://fonts.googleapis.com" />
<link href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@500;600;700&family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet" />
<script src="https://cdn.tailwindcss.com"></script>
<script src="https://unpkg.com/react@18/umd/react.production.min.js"></script>
<script src="https://unpkg.com/react-dom@18/umd/react-dom.production.min.js"></script>
<style>
  body { margin: 0; background: #F3F4F9; }
  .font-display { font-family: 'Space Grotesk', sans-serif; }
  .font-body { font-family: 'Inter', sans-serif; }
  input::placeholder { color: #B4B8C8; }
</style>
</head>
<body>
<div id="root"></div>
<script type="module">
import htm from "https://esm.sh/htm@3.1.1";
const html = htm.bind(React.createElement);
const { useState, useMemo, useCallback } = React;

const BG = "#F3F4F9";
const CARD = "#FFFFFF";
const INK = "#171A2B";
const INK_SOFT = "#8A8FA3";
const LINE = "#ECEDF4";
const GREEN = "#00B87C";
const RED = "#FF5B5B";
const GRAD = "linear-gradient(135deg, #7C5CFC 0%, #4C6FFF 100%)";
const ACCENT = "#4C6FFF";

const CATEGORIES = [
  { id: "cibo", label: "Cibo & Spesa", emoji: "🛒", color: "#00B87C" },
  { id: "ristoranti", label: "Ristoranti & Bar", emoji: "🍽️", color: "#FF8A3D" },
  { id: "casa", label: "Casa & Bollette", emoji: "🏠", color: "#4C6FFF" },
  { id: "trasporti", label: "Trasporti", emoji: "🚗", color: "#00B8D9" },
  { id: "sport", label: "Sport & Benessere", emoji: "🏋️", color: "#12C2A9" },
  { id: "tempolibero", label: "Tempo Libero", emoji: "🎬", color: "#8B5CF6" },
  { id: "curapersonale", label: "Cura Personale", emoji: "💇", color: "#F45B96" },
  { id: "shopping", label: "Shopping", emoji: "🛍️", color: "#F5A623" },
  { id: "viaggi", label: "Viaggi", emoji: "✈️", color: "#8B5E3C" },
  { id: "altro", label: "Altro", emoji: "⚪", color: "#9096A8" },
];
const CAT_MAP = Object.fromEntries(CATEGORIES.map((c) => [c.id, c]));

// Nessun dato precaricato: l'utente inserisce tutto da app.
const DEFAULT_FIXED_TEMPLATES = [];
const DEFAULT_BUDGET = 0;

const MAX_MONTH = "2026-12";
const MESI = ["Gennaio","Febbraio","Marzo","Aprile","Maggio","Giugno","Luglio","Agosto","Settembre","Ottobre","Novembre","Dicembre"];
const MESI_BREVE = ["Gen","Feb","Mar","Apr","Mag","Giu","Lug","Ago","Set","Ott","Nov","Dic"];

const todayISO = () => new Date().toISOString().slice(0, 10);
const monthKey = (d) => d.slice(0, 7);
const eur = (n) => n.toLocaleString("it-IT", { minimumFractionDigits: 2, maximumFractionDigits: 2 });
const statusKey = (mk, tid) => `${mk}::${tid}`;

function loadLS(key, fallback) {
  try { const raw = localStorage.getItem(key); return raw ? JSON.parse(raw) : fallback; }
  catch (e) { return fallback; }
}
function saveLS(key, value) { try { localStorage.setItem(key, JSON.stringify(value)); } catch (e) {} }

function monthsFromJulyToCurrent(endMonth) {
  const start = "2026-07";
  const current = endMonth || monthKey(todayISO());
  const out = [];
  let [y, m] = start.split("-").map(Number);
  const [cy, cm] = current.split("-").map(Number);
  while (y < cy || (y === cy && m <= cm)) {
    out.push(`${y}-${String(m).padStart(2, "0")}`);
    m += 1;
    if (m > 12) { m = 1; y += 1; }
  }
  return out;
}

function EmojiBadge({ emoji, color, size = 34, fontSize = 16 }) {
  return html`<div className="flex items-center justify-center rounded-full shrink-0" style=${{ width: size, height: size, backgroundColor: color, fontSize }}>${emoji}</div>`;
}

function TabBar({ active, onChange }) {
  const tabs = [
    { id: "inserimento", label: "Home", emoji: "💳" },
    { id: "forecast", label: "Forecast", emoji: "🎯" },
    { id: "trend", label: "Trend", emoji: "📊" },
  ];
  return html`
    <div className="fixed bottom-0 left-0 right-0 z-40" style=${{ backgroundColor: CARD, borderTop: `1px solid ${LINE}` }}>
      <div className="max-w-md mx-auto flex px-2 py-2">
        ${tabs.map(({ id, label, emoji }) => {
          const isActive = active === id;
          return html`
            <button key=${id} onClick=${() => onChange(id)} className="flex-1 flex flex-col items-center gap-1 py-1.5 rounded-2xl transition-colors" style=${{ backgroundColor: isActive ? "#F0F1FB" : "transparent" }}>
              <span style=${{ fontSize: 18, opacity: isActive ? 1 : 0.55 }}>${emoji}</span>
              <span className="text-[11px] font-semibold" style=${{ color: isActive ? ACCENT : INK_SOFT }}>${label}</span>
            </button>`;
        })}
      </div>
    </div>`;
}

function MonthNav({ viewMonth, onChange, light }) {
  const isFuture = viewMonth >= MAX_MONTH;
  const [vy, vm] = viewMonth.split("-").map(Number);
  const changeMonth = (delta) => {
    const d = new Date(vy, vm - 1 + delta, 1);
    const next = `${d.getFullYear()}-${String(d.getMonth() + 1).padStart(2, "0")}`;
    if (next > MAX_MONTH) return;
    onChange(next);
  };
  const col = light ? "rgba(255,255,255,0.85)" : INK_SOFT;
  const btnBg = light ? "rgba(255,255,255,0.18)" : "#F3F4F9";
  return html`
    <div className="flex items-center justify-between mb-4">
      <button onClick=${() => changeMonth(-1)} className="p-1.5 rounded-full" style=${{ backgroundColor: btnBg }}><span style=${{ color: col }}>◀</span></button>
      <span className="text-sm font-semibold" style=${{ color: col }}>${MESI[vm - 1]} ${vy}</span>
      <button onClick=${() => changeMonth(1)} disabled=${isFuture} className="p-1.5 rounded-full" style=${{ backgroundColor: btnBg, opacity: isFuture ? 0.3 : 1 }}><span style=${{ color: col }}>▶</span></button>
    </div>`;
}

function Segmented({ value, onChange, options }) {
  return html`
    <div className="flex p-1 rounded-2xl mb-5" style=${{ backgroundColor: "#EAEBF3" }}>
      ${options.map((opt) => {
        const active = value === opt.id;
        return html`
          <button key=${opt.id} onClick=${() => onChange(opt.id)} className="flex-1 py-2 rounded-xl text-sm font-semibold transition-colors" style=${{ backgroundColor: active ? CARD : "transparent", color: active ? INK : INK_SOFT, boxShadow: active ? "0 1px 3px rgba(23,26,43,0.1)" : "none" }}>${opt.label}</button>`;
      })}
    </div>`;
}

function DonutChart({ data, size = 116, thickness = 15 }) {
  const total = data.reduce((s, d) => s + d.value, 0);
  const r = (size - thickness) / 2;
  const C = 2 * Math.PI * r;
  let cumulative = 0;
  return html`
    <svg width=${size} height=${size} viewBox=${`0 0 ${size} ${size}`}>
      <circle cx=${size / 2} cy=${size / 2} r=${r} fill="none" stroke="#F0F1F6" strokeWidth=${thickness} />
      ${total > 0 && data.map((d, i) => {
        const frac = d.value / total;
        const dash = frac * C;
        const gap = C - dash;
        const offset = -cumulative * C;
        cumulative += frac;
        return html`<circle key=${i} cx=${size / 2} cy=${size / 2} r=${r} fill="none" stroke=${d.color} strokeWidth=${thickness} strokeDasharray=${`${dash} ${gap}`} strokeDashoffset=${offset} transform=${`rotate(-90 ${size / 2} ${size / 2})`} />`;
      })}
      <text x="50%" y="46%" textAnchor="middle" style=${{ fontFamily: "Space Grotesk", fontWeight: 700, fontSize: 17, fill: INK }}>€${Math.round(total)}</text>
      <text x="50%" y="62%" textAnchor="middle" style=${{ fontFamily: "Inter", fontSize: 10, fill: INK_SOFT }}>speso</text>
    </svg>`;
}

function RingProgress({ pct, size = 160, thickness = 14, color, trackColor }) {
  const r = (size - thickness) / 2;
  const C = 2 * Math.PI * r;
  const dash = (Math.min(100, Math.max(0, pct)) / 100) * C;
  return html`
    <svg width=${size} height=${size} viewBox=${`0 0 ${size} ${size}`}>
      <circle cx=${size / 2} cy=${size / 2} r=${r} fill="none" stroke=${trackColor} strokeWidth=${thickness} />
      <circle cx=${size / 2} cy=${size / 2} r=${r} fill="none" stroke=${color} strokeWidth=${thickness} strokeDasharray=${`${dash} ${C - dash}`} strokeLinecap="round" transform=${`rotate(-90 ${size / 2} ${size / 2})`} />
    </svg>`;
}

function MiniStackedChart({ data }) {
  const maxVal = Math.max(...data.map((r) => r.total), 1);
  const barW = 44;
  const totalW = Math.max(data.length * barW, 260);
  return html`
    <div className="overflow-x-auto">
      <div className="relative" style=${{ height: 200, width: totalW }}>
        <div className="flex items-end h-full">
          ${data.map((row) => html`
            <div key=${row.mk} className="flex flex-col items-center justify-end h-full" style=${{ width: barW }}>
              <div className="flex flex-col-reverse rounded-t-md overflow-hidden" style=${{ width: 26, height: `${(row.total / maxVal) * 100}%`, minHeight: row.total > 0 ? 4 : 0 }}>
                ${CATEGORIES.map((c) => {
                  const v = row[c.id] || 0;
                  if (v <= 0) return null;
                  return html`<div key=${c.id} style=${{ height: `${(v / (row.total || 1)) * 100}%`, width: 26, backgroundColor: c.color }} />`;
                })}
              </div>
            </div>`)}
        </div>
      </div>
      <div className="flex" style=${{ width: totalW }}>
        ${data.map((row) => html`<span key=${row.mk} className="text-center text-[11px]" style=${{ color: INK_SOFT, width: barW }}>${row.month}</span>`)}
      </div>
    </div>`;
}

function Bilancio() {
  const [tab, setTab] = useState("inserimento");
  const [segment, setSegment] = useState("variabili");

  const [expenses, setExpenses] = useState(() => loadLS("expenses", []));
  const [fixedTemplates, setFixedTemplates] = useState(() => loadLS("fixed-templates", DEFAULT_FIXED_TEMPLATES));
  const [fixedStatus, setFixedStatus] = useState(() => loadLS("fixed-status", {}));
  const [incomeEntries, setIncomeEntries] = useState(() => loadLS("income-entries", []));
  const [monthlyBudget, setMonthlyBudget] = useState(() => loadLS("budget-settings", { monthlyBudget: DEFAULT_BUDGET }).monthlyBudget);
  const [budgetByMonth, setBudgetByMonth] = useState(() => loadLS("budget-by-month", {}));
  const [initialBalance, setInitialBalance] = useState(() => loadLS("initial-balance", null));
  const [balanceAdjustments, setBalanceAdjustments] = useState(() => loadLS("balance-adjustments", []));
  const [balanceHidden, setBalanceHidden] = useState(() => loadLS("balance-hidden", false));

  const [viewMonth, setViewMonth] = useState(monthKey(todayISO()));
  const [filterCategory, setFilterCategory] = useState(null);
  const [amount, setAmount] = useState("");
  const [category, setCategory] = useState("cibo");
  const [note, setNote] = useState("");
  const [entryDate, setEntryDate] = useState(todayISO());
  const [error, setError] = useState("");

  const [incomeAmount, setIncomeAmount] = useState("");
  const [incomeLabel, setIncomeLabel] = useState("");
  const [incomeDate, setIncomeDate] = useState(todayISO());

  const [showSettings, setShowSettings] = useState(false);
  const [budgetDraft, setBudgetDraft] = useState(String(monthlyBudget || ""));
  const [editingMonthBudget, setEditingMonthBudget] = useState(false);
  const [monthBudgetDraft, setMonthBudgetDraft] = useState("");
  const [editingInitialBalance, setEditingInitialBalance] = useState(false);
  const [initialBalanceDraft, setInitialBalanceDraft] = useState("");
  const [showBalanceCorrection, setShowBalanceCorrection] = useState(false);
  const [correctionDraft, setCorrectionDraft] = useState("");

  const [editingExpense, setEditingExpense] = useState(null);
  const [editAmountDraft, setEditAmountDraft] = useState("");
  const [editCategoryDraft, setEditCategoryDraft] = useState("cibo");
  const [editNoteDraft, setEditNoteDraft] = useState("");
  const [editDateDraft, setEditDateDraft] = useState(todayISO());

  const [editingIncome, setEditingIncome] = useState(null);
  const [editIncomeAmountDraft, setEditIncomeAmountDraft] = useState("");
  const [editIncomeLabelDraft, setEditIncomeLabelDraft] = useState("");
  const [editIncomeDateDraft, setEditIncomeDateDraft] = useState(todayISO());

  const [editingFixed, setEditingFixed] = useState(null);
  const [fixedNameDraft, setFixedNameDraft] = useState("");
  const [fixedAmountDraft, setFixedAmountDraft] = useState("");
  const [fixedCategoryDraft, setFixedCategoryDraft] = useState("casa");

  const persist = useCallback((key, value, setter) => { setter(value); saveLS(key, value); }, []);

  React.useEffect(() => {
    const isCurrentViewMonth = viewMonth === monthKey(todayISO());
    const newDate = isCurrentViewMonth ? todayISO() : `${viewMonth}-01`;
    setEntryDate(newDate);
    setIncomeDate(newDate);
    setFilterCategory(null);
  }, [viewMonth]);

  const saveBudget = () => {
    const val = parseFloat(budgetDraft.replace(",", "."));
    if (isNaN(val) || val <= 0) return;
    setMonthlyBudget(val);
    saveLS("budget-settings", { monthlyBudget: val });
    setShowSettings(false);
  };

  const budgetForMonth = (mk) => budgetByMonth[mk] ?? monthlyBudget;

  const saveInitialBalance = () => {
    const val = parseFloat(initialBalanceDraft.replace(",", "."));
    if (isNaN(val)) return;
    persist("initial-balance", val, setInitialBalance);
    setEditingInitialBalance(false);
  };

  const computeMonthSaldo = (mk) => {
    const variableTotal = expenses.filter((e) => monthKey(e.date) === mk).reduce((s, e) => s + e.amount, 0);
    const fixedTotal = fixedTemplates.reduce((s, t) => { const st = fixedStatus[statusKey(mk, t.id)]; return s + (st?.amount ?? t.amount); }, 0);
    const incomeTotal = incomeEntries.filter((e) => monthKey(e.date) === mk).reduce((s, e) => s + e.amount, 0);
    return incomeTotal - fixedTotal - variableTotal;
  };

  const computeAccountBalanceForMonth = useCallback((mk) => {
    if (initialBalance === null) return null;
    const months = monthsFromJulyToCurrent(mk);
    const cumulativeSaldo = months.reduce((s, m) => s + computeMonthSaldo(m), 0);
    const adjTotal = balanceAdjustments.filter((a) => a.date <= `${mk}-31`).reduce((s, a) => s + a.delta, 0);
    return initialBalance + cumulativeSaldo + adjTotal;
  }, [initialBalance, expenses, fixedTemplates, fixedStatus, incomeEntries, balanceAdjustments]);

  const accountBalance = useMemo(() => computeAccountBalanceForMonth(viewMonth), [computeAccountBalanceForMonth, viewMonth]);

  const prevMonthKey = useMemo(() => {
    const [y, m] = viewMonth.split("-").map(Number);
    const d = new Date(y, m - 2, 1);
    return `${d.getFullYear()}-${String(d.getMonth() + 1).padStart(2, "0")}`;
  }, [viewMonth]);

  const saveCorrection = () => {
    const real = parseFloat(correctionDraft.replace(",", "."));
    if (isNaN(real) || accountBalance === null) return;
    const delta = real - accountBalance;
    const entry = { id: `${Date.now()}-${Math.random().toString(36).slice(2, 5)}`, date: todayISO(), delta };
    persist("balance-adjustments", [...balanceAdjustments, entry], setBalanceAdjustments);
    setShowBalanceCorrection(false);
    setCorrectionDraft("");
  };

  const openMonthBudgetEditor = () => {
    setMonthBudgetDraft(String(budgetForMonth(viewMonth) || ""));
    setEditingMonthBudget(true);
  };
  const saveMonthBudget = () => {
    const val = parseFloat(monthBudgetDraft.replace(",", "."));
    if (isNaN(val) || val <= 0) return;
    persist("budget-by-month", { ...budgetByMonth, [viewMonth]: val }, setBudgetByMonth);
    setEditingMonthBudget(false);
  };

  const addExpense = () => {
    const val = parseFloat(amount.replace(",", "."));
    if (isNaN(val) || val <= 0) { setError("Inserisci un importo valido."); return; }
    setError("");
    const entry = { id: `${Date.now()}-${Math.random().toString(36).slice(2, 7)}`, amount: val, category, note: note.trim(), date: entryDate || todayISO() };
    persist("expenses", [entry, ...expenses], setExpenses);
    setAmount(""); setNote(""); setEntryDate(todayISO());
  };
  const deleteExpense = (id) => persist("expenses", expenses.filter((e) => e.id !== id), setExpenses);

  const openExpenseEditor = (e) => {
    setEditingExpense(e);
    setEditAmountDraft(String(e.amount));
    setEditCategoryDraft(e.category);
    setEditNoteDraft(e.note || "");
    setEditDateDraft(e.date);
  };
  const saveExpenseEdit = () => {
    const val = parseFloat(editAmountDraft.replace(",", "."));
    if (isNaN(val) || val <= 0) return;
    const updated = expenses.map((e) => (e.id === editingExpense.id ? { ...e, amount: val, category: editCategoryDraft, note: editNoteDraft.trim(), date: editDateDraft } : e));
    persist("expenses", updated, setExpenses);
    setEditingExpense(null);
  };

  const addIncome = () => {
    const val = parseFloat(incomeAmount.replace(",", "."));
    if (isNaN(val) || val <= 0) { setError("Inserisci un importo valido."); return; }
    setError("");
    const entry = { id: `${Date.now()}-${Math.random().toString(36).slice(2, 7)}`, amount: val, label: incomeLabel.trim() || "Entrata", date: incomeDate || todayISO() };
    persist("income-entries", [entry, ...incomeEntries], setIncomeEntries);
    setIncomeAmount(""); setIncomeLabel(""); setIncomeDate(todayISO());
  };
  const deleteIncome = (id) => persist("income-entries", incomeEntries.filter((e) => e.id !== id), setIncomeEntries);

  const openIncomeEditor = (e) => {
    setEditingIncome(e);
    setEditIncomeAmountDraft(String(e.amount));
    setEditIncomeLabelDraft(e.label);
    setEditIncomeDateDraft(e.date);
  };
  const saveIncomeEdit = () => {
    const val = parseFloat(editIncomeAmountDraft.replace(",", "."));
    if (isNaN(val) || val <= 0) return;
    const updated = incomeEntries.map((e) => (e.id === editingIncome.id ? { ...e, amount: val, label: editIncomeLabelDraft.trim() || "Entrata", date: editIncomeDateDraft } : e));
    persist("income-entries", updated, setIncomeEntries);
    setEditingIncome(null);
  };

  const exportCSV = () => {
    const rows = [["Tipo", "Data", "Categoria/Etichetta", "Nota", "Importo"]];
    for (const e of expenses) rows.push(["Variabile", e.date, CAT_MAP[e.category]?.label || e.category, e.note || "", e.amount.toFixed(2)]);
    for (const e of incomeEntries) rows.push(["Entrata", e.date, e.label, "", e.amount.toFixed(2)]);
    for (const t of fixedTemplates) rows.push(["Fissa (ricorrente)", "", t.name, CAT_MAP[t.category]?.label || t.category, t.amount.toFixed(2)]);
    const csv = rows.map((r) => r.map((v) => `"${String(v).replace(/"/g, '""')}"`).join(",")).join("\n");
    const blob = new Blob(["\uFEFF" + csv], { type: "text/csv;charset=utf-8;" });
    const url = URL.createObjectURL(blob);
    const a = document.createElement("a");
    a.href = url;
    a.download = `bilancio-export-${todayISO()}.csv`;
    a.click();
    URL.revokeObjectURL(url);
  };

  const exportData = () => {
    const payload = { expenses, fixedTemplates, fixedStatus, incomeEntries, monthlyBudget, budgetByMonth, initialBalance, balanceAdjustments, exportedAt: new Date().toISOString() };
    const blob = new Blob([JSON.stringify(payload, null, 2)], { type: "application/json" });
    const url = URL.createObjectURL(blob);
    const a = document.createElement("a");
    a.href = url;
    a.download = `bilancio-backup-${todayISO()}.json`;
    a.click();
    URL.revokeObjectURL(url);
  };

  const importData = (file) => {
    const reader = new FileReader();
    reader.onload = (e) => {
      try {
        const data = JSON.parse(e.target.result);
        if (data.expenses) persist("expenses", data.expenses, setExpenses);
        if (data.fixedTemplates) persist("fixed-templates", data.fixedTemplates, setFixedTemplates);
        if (data.fixedStatus) persist("fixed-status", data.fixedStatus, setFixedStatus);
        if (data.incomeEntries) persist("income-entries", data.incomeEntries, setIncomeEntries);
        if (typeof data.monthlyBudget === "number") { setMonthlyBudget(data.monthlyBudget); saveLS("budget-settings", { monthlyBudget: data.monthlyBudget }); setBudgetDraft(String(data.monthlyBudget)); }
        if (data.budgetByMonth) persist("budget-by-month", data.budgetByMonth, setBudgetByMonth);
        if (typeof data.initialBalance === "number") persist("initial-balance", data.initialBalance, setInitialBalance);
        if (data.balanceAdjustments) persist("balance-adjustments", data.balanceAdjustments, setBalanceAdjustments);
        setShowSettings(false);
      } catch (err) { setError("File di backup non valido."); }
    };
    reader.readAsText(file);
  };

  const openFixedEditor = (tpl) => {
    if (tpl) {
      const st = fixedStatus[statusKey(viewMonth, tpl.id)];
      setEditingFixed(tpl);
      setFixedNameDraft(tpl.name);
      setFixedAmountDraft(String(st?.amount ?? tpl.amount));
      setFixedCategoryDraft(tpl.category);
    } else {
      setEditingFixed({ isNew: true });
      setFixedNameDraft(""); setFixedAmountDraft(""); setFixedCategoryDraft("casa");
    }
  };

  const saveFixedEditor = () => {
    const val = parseFloat(fixedAmountDraft.replace(",", "."));
    if (!fixedNameDraft.trim() || isNaN(val) || val <= 0) return;
    if (editingFixed.isNew) {
      const tpl = { id: `${Date.now()}-${Math.random().toString(36).slice(2, 5)}`, name: fixedNameDraft.trim(), amount: val, category: fixedCategoryDraft };
      persist("fixed-templates", [...fixedTemplates, tpl], setFixedTemplates);
    } else {
      const updated = fixedTemplates.map((t) => (t.id === editingFixed.id ? { ...t, name: fixedNameDraft.trim(), category: fixedCategoryDraft } : t));
      persist("fixed-templates", updated, setFixedTemplates);
      const key = statusKey(viewMonth, editingFixed.id);
      persist("fixed-status", { ...fixedStatus, [key]: { ...(fixedStatus[key] || {}), amount: val } }, setFixedStatus);
    }
    setEditingFixed(null);
  };

  const deleteFixedTemplate = () => {
    if (!editingFixed || editingFixed.isNew) return;
    persist("fixed-templates", fixedTemplates.filter((t) => t.id !== editingFixed.id), setFixedTemplates);
    setEditingFixed(null);
  };

  const toggleFixedPaid = (tpl) => {
    const key = statusKey(viewMonth, tpl.id);
    const current = fixedStatus[key] || {};
    persist("fixed-status", { ...fixedStatus, [key]: { ...current, paid: !current.paid } }, setFixedStatus);
  };

  const byRecency = (a, b) => {
    if (a.date !== b.date) return a.date < b.date ? 1 : -1;
    return b.id.localeCompare(a.id);
  };
  const monthExpenses = useMemo(() => expenses.filter((e) => monthKey(e.date) === viewMonth).sort(byRecency), [expenses, viewMonth]);
  const monthIncome = useMemo(() => incomeEntries.filter((e) => monthKey(e.date) === viewMonth).sort(byRecency), [incomeEntries, viewMonth]);

    const st = fixedStatus[statusKey(viewMonth, t.id)] || {};
    return { ...t, effectiveAmount: st.amount ?? t.amount, paid: !!st.paid };
  }), [fixedTemplates, fixedStatus, viewMonth]);

  const totals = useMemo(() => {
    const byCategory = {};
    let variableTotal = 0;
    for (const e of monthExpenses) { byCategory[e.category] = (byCategory[e.category] || 0) + e.amount; variableTotal += e.amount; }
    const fixedTotal = fixedForMonth.reduce((s, f) => s + f.effectiveAmount, 0);
    const incomeTotal = monthIncome.reduce((s, i) => s + i.amount, 0);
    const saldo = incomeTotal - fixedTotal - variableTotal;
    const stima = budgetForMonth(viewMonth);
    const [y, m] = viewMonth.split("-").map(Number);
    const daysInMonth = new Date(y, m, 0).getDate();
    const isCurrentMonth = viewMonth === monthKey(todayISO());
    const today = new Date().getDate();
    const daysElapsed = isCurrentMonth ? today : daysInMonth;
    const daysLeft = isCurrentMonth ? daysInMonth - today : 0;
    const avgDaily = daysElapsed > 0 ? variableTotal / daysElapsed : 0;
    const variableForecast = isCurrentMonth ? avgDaily * daysInMonth : variableTotal;
    const saldoPrevisto = incomeTotal - fixedTotal - stima;
    const remaining = stima - variableTotal;
    const dailyBudgetLeft = isCurrentMonth && daysLeft > 0 ? remaining / daysLeft : null;
    return { byCategory, variableTotal, fixedTotal, incomeTotal, saldo, stima, saldoPrevisto, variableForecast, remaining, isCurrentMonth, daysLeft, avgDaily, dailyBudgetLeft };

                    </div>
                  </div>`;
              })}
            </div>
            <p className="text-xs font-semibold uppercase tracking-wide mb-3 px-1" style=${{ color: INK_SOFT }}>Spese variabili per categoria</p>
            <div className="rounded-3xl p-4 mb-4" style=${{ backgroundColor: CARD, border: `1px solid ${LINE}` }}>
              <${MiniStackedChart} data=${trendData} />
            </div>
            <div className="flex flex-wrap gap-x-3 gap-y-2 px-1">
              ${CATEGORIES.map((c) => html`<div key=${c.id} className="flex items-center gap-1.5"><span className="w-2.5 h-2.5 rounded-full" style=${{ backgroundColor: c.color }} /><span className="text-xs" style=${{ color: INK_SOFT }}>${c.label}</span></div>`)}
            </div>
          </div>`}
      </div>

      <${TabBar} active=${tab} onChange=${setTab} />

      ${editingInitialBalance && html`
        <div className="fixed inset-0 flex items-end justify-center z-50" style=${{ backgroundColor: "rgba(23,26,43,0.45)" }} onClick=${() => setEditingInitialBalance(false)}>
          <div onClick=${(e) => e.stopPropagation()} className="w-full max-w-md rounded-t-3xl p-5" style=${{ backgroundColor: CARD }}>
            <div className="flex items-center justify-between mb-4"><h2 className="font-display text-xl font-bold">Saldo di partenza</h2><button onClick=${() => setEditingInitialBalance(false)}>✕</button></div>
            <label className="text-xs font-semibold uppercase tracking-wide" style=${{ color: INK_SOFT }}>Quanto avevi sul conto a inizio luglio 2026</label>
            <div className="flex items-baseline gap-1 mt-1 mb-4"><span className="font-display text-xl font-semibold" style=${{ color: INK_SOFT }}>€</span><input type="text" inputMode="decimal" value=${initialBalanceDraft} onChange=${(e) => setInitialBalanceDraft(e.target.value)} placeholder="0,00" className="font-display text-2xl font-bold bg-transparent outline-none w-full" /></div>
            <button onClick=${saveInitialBalance} className="w-full py-3.5 rounded-2xl font-semibold text-white" style=${{ background: GRAD }}>Salva</button>
          </div>
        </div>`}

      ${showBalanceCorrection && html`
        <div className="fixed inset-0 flex items-end justify-center z-50" style=${{ backgroundColor: "rgba(23,26,43,0.45)" }} onClick=${() => setShowBalanceCorrection(false)}>
          <div onClick=${(e) => e.stopPropagation()} className="w-full max-w-md rounded-t-3xl p-5" style=${{ backgroundColor: CARD }}>
            <div className="flex items-center justify-between mb-4"><h2 className="font-display text-xl font-bold">Correggi saldo</h2><button onClick=${() => setShowBalanceCorrection(false)}>✕</button></div>
            <label className="text-xs font-semibold uppercase tracking-wide" style=${{ color: INK_SOFT }}>Saldo reale attuale sul tuo conto</label>
            <div className="flex items-baseline gap-1 mt-1 mb-2"><span className="font-display text-xl font-semibold" style=${{ color: INK_SOFT }}>€</span><input type="text" inputMode="decimal" value=${correctionDraft} onChange=${(e) => setCorrectionDraft(e.target.value)} className="font-display text-2xl font-bold bg-transparent outline-none w-full" /></div>
            <p className="text-xs mb-4" style=${{ color: INK_SOFT }}>Calcolato: € ${eur(accountBalance || 0)} — la differenza verrà salvata come correzione</p>
            <button onClick=${saveCorrection} className="w-full py-3.5 rounded-2xl font-semibold text-white" style=${{ background: GRAD }}>Salva</button>
          </div>
        </div>`}

      ${editingMonthBudget && html`
        <div className="fixed inset-0 flex items-end justify-center z-50" style=${{ backgroundColor: "rgba(23,26,43,0.45)" }} onClick=${() => setEditingMonthBudget(false)}>
          <div onClick=${(e) => e.stopPropagation()} className="w-full max-w-md rounded-t-3xl p-5" style=${{ backgroundColor: CARD }}>
            <div className="flex items-center justify-between mb-4"><h2 className="font-display text-xl font-bold">Stima per ${MESI[Number(viewMonth.split("-")[1]) - 1]}</h2><button onClick=${() => setEditingMonthBudget(false)}>✕</button></div>
            <label className="text-xs font-semibold uppercase tracking-wide" style=${{ color: INK_SOFT }}>Quanto pensi di spendere in variabili questo mese</label>
            <div className="flex items-baseline gap-1 mt-1 mb-4"><span className="font-display text-xl font-semibold" style=${{ color: INK_SOFT }}>€</span><input type="text" inputMode="decimal" value=${monthBudgetDraft} onChange=${(e) => setMonthBudgetDraft(e.target.value)} placeholder="0,00" className="font-display text-2xl font-bold bg-transparent outline-none w-full" /></div>
            <button onClick=${saveMonthBudget} className="w-full py-3.5 rounded-2xl font-semibold text-white" style=${{ background: GRAD }}>Salva</button>
          </div>
        </div>`}

      ${showSettings && html`
        <div className="fixed inset-0 flex items-end justify-center z-50" style=${{ backgroundColor: "rgba(23,26,43,0.45)" }} onClick=${() => setShowSettings(false)}>
          <div onClick=${(e) => e.stopPropagation()} className="w-full max-w-md rounded-t-3xl p-5" style=${{ backgroundColor: CARD }}>
            <div className="flex items-center justify-between mb-4"><h2 className="font-display text-xl font-bold">Stima di default</h2><button onClick=${() => setShowSettings(false)}>✕</button></div>
            <label className="text-xs font-semibold uppercase tracking-wide" style=${{ color: INK_SOFT }}>Usata per i mesi senza una stima specifica (modificabile dal tab Forecast)</label>
            <p className="text-[11px] mb-1" style=${{ color: INK_SOFT }}></p>
            <div className="flex items-baseline gap-1 mt-1 mb-4"><span className="font-display text-xl font-semibold" style=${{ color: INK_SOFT }}>€</span><input type="text" inputMode="decimal" value=${budgetDraft} onChange=${(e) => setBudgetDraft(e.target.value)} placeholder="0,00" className="font-display text-2xl font-bold bg-transparent outline-none w-full" /></div>
            <button onClick=${saveBudget} className="w-full py-3.5 rounded-2xl font-semibold text-white mb-4" style=${{ background: GRAD }}>Salva</button>
            <div style=${{ borderTop: `1px solid ${LINE}` }} className="pt-4">
              <p className="text-xs font-semibold uppercase tracking-wide mb-2" style=${{ color: INK_SOFT }}>Backup dati</p>
              <button onClick=${exportData} className="w-full py-3 rounded-2xl font-semibold mb-2" style=${{ backgroundColor: "#F0F1FB", color: ACCENT }}>⬇️ Esporta backup</button>
              <button onClick=${exportCSV} className="w-full py-3 rounded-2xl font-semibold mb-2" style=${{ backgroundColor: "#F0F1FB", color: ACCENT }}>📊 Esporta CSV (Excel)</button>
              <label className="w-full py-3 rounded-2xl font-semibold flex items-center justify-center cursor-pointer" style=${{ backgroundColor: "#F8F8FB", color: INK_SOFT }}>
                ⬆️ Ripristina da backup
                <input type="file" accept="application/json" className="hidden" onChange=${(e) => { if (e.target.files[0]) importData(e.target.files[0]); }} />
              </label>
            </div>
          </div>
        </div>`}

      ${editingExpense && html`
        <div className="fixed inset-0 flex items-end justify-center z-50" style=${{ backgroundColor: "rgba(23,26,43,0.45)" }} onClick=${() => setEditingExpense(null)}>
          <div onClick=${(e) => e.stopPropagation()} className="w-full max-w-md rounded-t-3xl p-5" style=${{ backgroundColor: CARD }}>
            <div className="flex items-center justify-between mb-4"><h2 className="font-display text-xl font-bold">Modifica spesa</h2><button onClick=${() => setEditingExpense(null)}>✕</button></div>
            <label className="text-xs font-semibold uppercase tracking-wide" style=${{ color: INK_SOFT }}>Importo</label>
            <div className="flex items-baseline gap-1 mt-1 mb-4"><span className="font-display text-xl font-semibold" style=${{ color: INK_SOFT }}>€</span><input type="text" inputMode="decimal" value=${editAmountDraft} onChange=${(e) => setEditAmountDraft(e.target.value)} className="font-display text-2xl font-bold bg-transparent outline-none w-full" /></div>
            <label className="text-xs font-semibold uppercase tracking-wide" style=${{ color: INK_SOFT }}>Categoria</label>
            ${catChipsGrid(editCategoryDraft, setEditCategoryDraft)}
            <label className="text-xs font-semibold uppercase tracking-wide" style=${{ color: INK_SOFT }}>Nota</label>
            <input type="text" value=${editNoteDraft} onChange=${(e) => setEditNoteDraft(e.target.value)} className="w-full mt-1 mb-4 px-4 py-3 rounded-2xl text-sm outline-none" style=${{ backgroundColor: "#F8F8FB" }} />
            <label className="text-xs font-semibold uppercase tracking-wide" style=${{ color: INK_SOFT }}>Data</label>
            <input type="date" value=${editDateDraft} onChange=${(e) => setEditDateDraft(e.target.value)} min="2026-07-01" max=${`${MAX_MONTH}-31`} className="w-full mt-1 mb-5 px-4 py-3 rounded-2xl text-sm outline-none" style=${{ backgroundColor: "#F8F8FB", color: INK }} />
            <button onClick=${saveExpenseEdit} className="w-full py-3.5 rounded-2xl font-semibold text-white" style=${{ background: GRAD }}>Salva</button>
          </div>
        </div>`}

      ${editingIncome && html`
        <div className="fixed inset-0 flex items-end justify-center z-50" style=${{ backgroundColor: "rgba(23,26,43,0.45)" }} onClick=${() => setEditingIncome(null)}>
          <div onClick=${(e) => e.stopPropagation()} className="w-full max-w-md rounded-t-3xl p-5" style=${{ backgroundColor: CARD }}>
            <div className="flex items-center justify-between mb-4"><h2 className="font-display text-xl font-bold">Modifica entrata</h2><button onClick=${() => setEditingIncome(null)}>✕</button></div>
            <label className="text-xs font-semibold uppercase tracking-wide" style=${{ color: INK_SOFT }}>Importo</label>
            <div className="flex items-baseline gap-1 mt-1 mb-4"><span className="font-display text-xl font-semibold" style=${{ color: INK_SOFT }}>€</span><input type="text" inputMode="decimal" value=${editIncomeAmountDraft} onChange=${(e) => setEditIncomeAmountDraft(e.target.value)} className="font-display text-2xl font-bold bg-transparent outline-none w-full" /></div>
            <label className="text-xs font-semibold uppercase tracking-wide" style=${{ color: INK_SOFT }}>Etichetta</label>
            <input type="text" value=${editIncomeLabelDraft} onChange=${(e) => setEditIncomeLabelDraft(e.target.value)} className="w-full mt-1 mb-4 px-4 py-3 rounded-2xl text-sm outline-none" style=${{ backgroundColor: "#F8F8FB" }} />
            <label className="text-xs font-semibold uppercase tracking-wide" style=${{ color: INK_SOFT }}>Data</label>
            <input type="date" value=${editIncomeDateDraft} onChange=${(e) => setEditIncomeDateDraft(e.target.value)} min="2026-07-01" max=${`${MAX_MONTH}-31`} className="w-full mt-1 mb-5 px-4 py-3 rounded-2xl text-sm outline-none" style=${{ backgroundColor: "#F8F8FB", color: INK }} />
            <button onClick=${saveIncomeEdit} className="w-full py-3.5 rounded-2xl font-semibold text-white" style=${{ backgroundColor: GREEN }}>Salva</button>
          </div>
        </div>`}

      ${editingFixed && html`
        <div className="fixed inset-0 flex items-end justify-center z-50" style=${{ backgroundColor: "rgba(23,26,43,0.45)" }} onClick=${() => setEditingFixed(null)}>
          <div onClick=${(e) => e.stopPropagation()} className="w-full max-w-md rounded-t-3xl p-5" style=${{ backgroundColor: CARD }}>
            <div className="flex items-center justify-between mb-4"><h2 className="font-display text-xl font-bold">${editingFixed.isNew ? "Nuova voce fissa" : "Modifica voce fissa"}</h2><button onClick=${() => setEditingFixed(null)}>✕</button></div>
            <label className="text-xs font-semibold uppercase tracking-wide" style=${{ color: INK_SOFT }}>Nome</label>
            <input type="text" value=${fixedNameDraft} onChange=${(e) => setFixedNameDraft(e.target.value)} placeholder="es. Mutuo" className="w-full mt-1 mb-4 px-4 py-3 rounded-2xl text-sm outline-none" style=${{ backgroundColor: "#F8F8FB" }} />
            <label className="text-xs font-semibold uppercase tracking-wide" style=${{ color: INK_SOFT }}>Importo ${!editingFixed.isNew ? "(solo per questo mese)" : ""}</label>
            <div className="flex items-baseline gap-1 mt-1 mb-4"><span className="font-display text-xl font-semibold" style=${{ color: INK_SOFT }}>€</span><input type="text" inputMode="decimal" value=${fixedAmountDraft} onChange=${(e) => setFixedAmountDraft(e.target.value)} placeholder="0,00" className="font-display text-2xl font-bold bg-transparent outline-none w-full" /></div>
            <label className="text-xs font-semibold uppercase tracking-wide" style=${{ color: INK_SOFT }}>Categoria</label>
            ${catChipsGrid(fixedCategoryDraft, setFixedCategoryDraft)}
            <button onClick=${saveFixedEditor} className="w-full py-3.5 rounded-2xl font-semibold text-white mb-2" style=${{ background: GRAD }}>Salva</button>
            ${!editingFixed.isNew && html`<button onClick=${deleteFixedTemplate} className="w-full py-3 rounded-2xl font-semibold" style=${{ color: RED }}>Elimina voce fissa</button>`}
          </div>
        </div>`}
    </div>`;
}

ReactDOM.createRoot(document.getElementById("root")).render(html`<${Bilancio} />`);
</script>
</body>
</html>
