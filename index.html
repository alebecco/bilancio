<!DOCTYPE html>
<html lang="it">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>Recupero dati Bilancio</title>
<style>
  body { font-family: -apple-system, sans-serif; background: #F3F4F9; color: #171A2B; margin: 0; padding: 24px 20px; }
  h1 { font-size: 22px; }
  button { display: block; width: 100%; padding: 16px; margin: 10px 0; border: none; border-radius: 14px; font-size: 16px; font-weight: 600; cursor: pointer; }
  .primary { background: #4C6FFF; color: white; }
  .secondary { background: #E8EAF6; color: #171A2B; }
  pre { background: white; border-radius: 12px; padding: 12px; font-size: 11px; overflow-x: auto; white-space: pre-wrap; word-break: break-all; max-height: 300px; overflow-y: auto; }
  .ok { color: #00B87C; font-weight: 600; }
</style>
</head>
<body>
<h1>🔧 Recupero dati Bilancio</h1>
<p id="status">Controllo i dati salvati su questo dispositivo...</p>
<div id="actions"></div>
<pre id="preview" style="display:none;"></pre>

<script>
  const KEYS = ["expenses", "fixed-templates", "fixed-status", "income-entries", "budget-settings", "budget-by-month", "initial-balance", "balance-adjustments", "balance-hidden"];
  const data = {};
  let found = 0;
  KEYS.forEach(k => {
    const raw = localStorage.getItem(k);
    if (raw !== null) {
      try { data[k] = JSON.parse(raw); found++; }
      catch(e) { data[k] = raw; found++; }
    }
  });

  const status = document.getElementById("status");
  const actions = document.getElementById("actions");
  const preview = document.getElementById("preview");

  if (found === 0) {
    status.innerHTML = "Non ho trovato nessun dato salvato su questo dispositivo per questa pagina.";
  } else {
    status.innerHTML = '<span class="ok">✓ Trovati dati salvati (' + found + ' voci).</span> Puoi scaricarli in sicurezza qui sotto.';

    const btn = document.createElement("button");
    btn.className = "primary";
    btn.textContent = "⬇️ Scarica backup (.json)";
    btn.onclick = () => {
      const payload = { ...data, exportedAt: new Date().toISOString(), source: "recovery-page" };
      const blob = new Blob([JSON.stringify(payload, null, 2)], { type: "application/json" });
      const url = URL.createObjectURL(blob);
      const a = document.createElement("a");
      a.href = url;
      a.download = "bilancio-recovery-" + new Date().toISOString().slice(0,10) + ".json";
      a.click();
    };
    actions.appendChild(btn);

    const btn2 = document.createElement("button");
    btn2.className = "secondary";
    btn2.textContent = "👁️ Mostra i dati qui (se il download non parte)";
    btn2.onclick = () => {
      preview.style.display = preview.style.display === "none" ? "block" : "none";
      preview.textContent = JSON.stringify(data, null, 2);
    };
    actions.appendChild(btn2);
  }
</script>
</body>
</html>
